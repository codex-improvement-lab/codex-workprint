    .workprint-artifact{background:#f1ecdf;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.eyebrow,.metric-label,.legend,.footer,.return-label,.quiet-label,.public-label,.panel-label,.moment-label,.structure-label,.fold-label,.turn-label{font-family:"Arial Narrow",Inter,ui-sans-serif,system-ui,sans-serif;font-weight:750;letter-spacing:1.7px}.eyebrow{font-size:13px;fill:#24251f}.run-title{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#f1ecdf}.metric-number{font-size:34px;font-weight:780;fill:#f1ecdf}.metric-label{font-size:10px;fill:#aeb4ad}.legend{font-size:10px;fill:#aeb4ad}.footer{font-size:11px;fill:#24251f}.return-label{font-size:9px;fill:#ff665c}.quiet-label{font-size:9px;fill:#aeb4ad}.public-label{font-size:10px;fill:#24251f}.panel-label{font-size:10px;fill:#aeb4ad}.moment-seq{font-size:22px;font-weight:800;fill:#11120f}.moment-label{font-size:10px;fill:#f1ecdf}.moment-detail{font-size:11px;fill:#aeb4ad}.structure-number{font-size:25px;font-weight:800;fill:#f1ecdf}.structure-label{font-size:9px;fill:#aeb4ad}.station-label{font-size:8px;font-weight:760;fill:#f1ecdf;letter-spacing:.8px}.station-seq{font-size:8px;font-weight:800;fill:#11120f}.empty{font-size:14px;letter-spacing:2px;fill:#aeb4ad}.phase-text{font-size:8px;font-weight:800;letter-spacing:.7px;fill:#f1ecdf}.fold-label,.turn-label{font-size:8px;fill:#aeb4ad}.station:focus{outline:none}.station:focus .focus-ring,.workline-station.is-replay-current .focus-ring{opacity:1}.workline-segment{stroke-dasharray:1800;stroke-dashoffset:0}.fold-segment{stroke-width:4}.replay-running .workline-segment,.replay-running .workline-station{opacity:.12}.replay-running .workline-segment.is-revealed,.replay-running .workline-station.is-revealed{opacity:1}.workline-segment,.workline-station{transition:opacity .18s ease}.public-label+.public-label{margin-left:8px}
    @media(prefers-reduced-motion:no-preference){.shape-reveal .workline-segment{animation:reveal 1.65s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--segment) * 38ms)}.workline-station.is-replay-current .focus-ring{animation:pulse .72s ease-out both}@keyframes reveal{from{stroke-dashoffset:1800}to{stroke-dashoffset:0}}@keyframes pulse{0%{r:10;opacity:1}100%{r:20;opacity:.15}}}
  </style>
